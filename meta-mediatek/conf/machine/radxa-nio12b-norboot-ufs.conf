require conf/machine/include/mt8195.inc
require conf/machine/include/mt7921.inc
require conf/machine/include/mt7925.inc
require conf/machine/include/ubifs-macronix-mx25u12832F.inc
require conf/machine/include/radxa.inc

# The MT8195 firmware DTB/DTBO set needs more than the stock 2MiB NOR
# firmware partition. Use 2.5MiB firmware partitions in the 16MiB layout.
UBIFS_MAX_LEB_CNT = "40"
UBIFS_VOL_SIZE_FIRMWARE_A = "2354688"
UBIFS_VOL_SIZE_FIRMWARE_B = "2354688"

# Kernel
KERNEL_DEVICETREE = "mediatek/mt8395-genio-1200-radxa-nio12b-ufs.dtb"
# Shared IMX214 dual-cam overlay (CAM0 PDN GPIO54, 3V3 GPIO104)
KERNEL_DEVICETREE_OVERLAYS_AUTOLOAD = "video.dtbo apusys.dtbo nio12b-camera-imx214-4lan.dtbo"

#FIXME U-Boot for nor support
UBOOT_MACHINE = "genio_1200_radxa_nio12b_norboot_ufs_defconfig"

#FIXME libdram for nor support
LIBDRAM_BOARD_NAME = "genio-1200-evk-ufs"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

# LK
LK_PROJECT = "mt8395-evk-norboot-ufs"
LK_BOARD_NAME = "${LK_PROJECT}"

# Trusted Firmware-A
TFA_NOR_FIP_ADDR = "0x200000"
TFA_NOR_FIP_LENGTH = "0x300000"
TFA_NOR_DRAMK_ADDR = "0xD00000"
TFA_NOR_MISC_ADDR = "0xD80000"

# UFS storage
WIC_SECTOR_SIZE = "4096"
WIC_BLOCK_SIZE = "4096"

OVERRIDES .= ":nor-boot"

MACHINE_FEATURES:append = " nor-boot ufs-system"
MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"
IMAGE_INSTALL:append = " \
    rkwifibt-firmware-aic8800d80-usb \
"

MACHINEOVERRIDES =. "mt8395-evk:genio-1200-evk:mt8395-evk-norboot-ufs:genio-1200-evk-norboot-ufs:genio-1200-radxa-nio12b-norboot-ufs:"
