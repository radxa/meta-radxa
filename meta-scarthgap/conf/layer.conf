# Compatibility shims for Scarthgap OE-core/meta-oe used with bitbake 2.18.
# Prepend so classes/conf overrides take precedence over OE-core/meta-oe.
BBPATH =. "${LAYERDIR}:"

# Extend the oe python package with bitbake-2.18 compatible helpers.
addpylib ${LAYERDIR}/lib oe

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-scarthgap"
BBFILE_PATTERN_meta-scarthgap = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-scarthgap = "6"

LAYERDEPENDS_meta-scarthgap = "core"
LAYERSERIES_COMPAT_meta-scarthgap = "scarthgap"
