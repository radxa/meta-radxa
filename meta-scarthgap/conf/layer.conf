# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-scarthgap"
BBFILE_PATTERN_meta-scarthgap = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-scarthgap = "6"

LAYERDEPENDS_meta-scarthgap = "core"
LAYERSERIES_COMPAT_meta-scarthgap = "scarthgap"
